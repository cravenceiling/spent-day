[package]
name = "spentday-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "spentday"
path = "src/main.rs"

[dependencies]
spentday-core = { path = "../../core" }
libc = "0.2"
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
pangocairo = "0.21"
zbus = "5"
x11rb = { version = "0.13", features = ["screensaver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tempfile = "3"

# GTK does not build on macOS, so this crate stays out of the root workspace.
[workspace]

[profile.release]
lto = true
strip = true
