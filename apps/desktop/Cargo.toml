[package]
name = "spentday-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Screen time across your devices"

[package.metadata.deb]
name = "spentday"
maintainer = "Spent Day contributors"
copyright = "2026 Spent Day contributors"
license-file = ["../../LICENSE", "0"]
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libvulkan1, libx11-6, libx11-xcb1, libxcursor1, libxi6, hicolor-icon-theme"
recommends = "mesa-vulkan-drivers"
assets = [
    ["target/release/spentday", "usr/bin/spentday", "755"],
    ["linux/data/day.spent.SpentDay.desktop", "usr/share/applications/day.spent.SpentDay.desktop", "644"],
    ["linux/data/icons/day.spent.SpentDay.svg", "usr/share/icons/hicolor/scalable/apps/day.spent.SpentDay.svg", "644"],
    ["../../packaging/linux/build/spentday.service", "usr/lib/systemd/user/spentday.service", "644"],
    ["linux/gnome-extension/metadata.json", "usr/share/gnome-shell/extensions/spentday@spent.day/metadata.json", "644"],
    ["linux/gnome-extension/extension.js", "usr/share/gnome-shell/extensions/spentday@spent.day/extension.js", "644"],
    ["linux/kwin-script/metadata.json", "usr/share/kwin/scripts/spentday-focus/metadata.json", "644"],
    ["linux/kwin-script/contents/code/main.js", "usr/share/kwin/scripts/spentday-focus/contents/code/main.js", "644"],
]

[[bin]]
name = "spentday"
path = "src/main.rs"

# The event loop must own the main thread, so this test brings its own `main`.
[[test]]
name = "lifecycle"
harness = false

[dependencies]
spentday-core = { path = "../../core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "90c1ff3a3008654577a042c00ae3e205155ece86" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "90c1ff3a3008654577a042c00ae3e205155ece86" }
jiff = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
x11rb = { version = "0.13", features = ["screensaver"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-services"] }
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "pwr_mgt", "objc2"] }
objc2-service-management = "0.3"

[profile.release]
lto = true
strip = true

[workspace]
