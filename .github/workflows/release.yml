name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/make-release-cert.sh'
      - 'apps/desktop/**'
      - 'apps/android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
  workflow_dispatch:

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions
        id: version
        shell: python
        run: |
          import os
          import plistlib
          import re
          import tomllib
          from pathlib import Path

          with open("apps/desktop/macos/Info.plist", "rb") as file:
              macos = plistlib.load(file)["CFBundleShortVersionString"]
          with open("apps/desktop/Cargo.toml", "rb") as file:
              desktop = tomllib.load(file)["package"]["version"]
          arch = re.search(r"^pkgver=(.+)$", Path("packaging/arch/PKGBUILD").read_text(), re.M)[1]
          if not macos == desktop == arch:
              raise SystemExit(f"Version mismatch: macOS={macos}, desktop={desktop}, PKGBUILD={arch}")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{macos}":
              raise SystemExit(f"Tag {os.environ['GITHUB_REF_NAME']} must be v{macos}, matching Info.plist and apps/desktop/Cargo.toml")
          # Android refuses an update whose versionCode does not increase.
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)", macos):
              raise SystemExit(f"Version {macos!r} must be major.minor.patch with minor and patch below 100")
          major, minor, patch = map(int, macos.split("."))
          android_code = major * 10000 + minor * 100 + patch
          if not 1 <= android_code <= 2100000000:
              raise SystemExit(f"Version {macos} gives Android versionCode {android_code}, outside 1 to 2100000000")
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"version={macos}\n")
              file.write(f"android_version_code={android_code}\n")

  macos:
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: macos-cargo-
      - name: Use ad-hoc signing for pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo '::notice::Pull request build: signing ad hoc. Automation grants will reset after updates.'
          echo 'SPENTDAY_SIGN_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Import release identity
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is absent. Signing ad hoc; Automation grants will reset after updates."
            echo 'SPENTDAY_SIGN_IDENTITY=-' >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/spentday-release.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/spentday-release.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/spentday-release.p12" -k "$keychain" \
            -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/spentday-release.p12" \
            -passin env:MACOS_SIGN_P12_PASSWORD -clcerts -nokeys -out "$RUNNER_TEMP/spentday-release.pem"
          # codesign needs an explicit trust anchor for a self-signed identity.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign "$RUNNER_TEMP/spentday-release.pem"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep '"Spent Day Release"'
          echo 'SPENTDAY_SIGN_IDENTITY=Spent Day Release' >> "$GITHUB_ENV"
      - name: Build app and disk image
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin
          apps/desktop/macos/bundle.sh
          mkdir -p "$RUNNER_TEMP/dmg" dist
          ditto 'apps/desktop/macos/build/Spent Day.app' "$RUNNER_TEMP/dmg/Spent Day.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          for attempt in 1 2 3; do
            if hdiutil create -volname 'Spent Day' -srcfolder "$RUNNER_TEMP/dmg" \
              -format UDZO -ov "dist/SpentDay-$VERSION-arm64.dmg"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::notice::Disk image creation failed; retrying in 5 seconds."
            sleep 5
          done
      - name: Remove release identity
        if: always()
        timeout-minutes: 2
        shell: bash
        # The trust setting stays: removing it waits on an authorization prompt no one can answer,
        # and the hosted runner VM is discarded after the job anyway.
        run: |
          if [ -f "$RUNNER_TEMP/spentday-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/spentday-release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/spentday-release.p12" "$RUNNER_TEMP/spentday-release.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_VERSION_CODE: ${{ needs.version.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-
      - name: Install Android build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 4.1.2 --locked
      # Pull requests exercise the toolchain without the release key, so a broken build shows up
      # before a tag does.
      - name: Test and build debug APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: cd apps/android && ./gradlew testDebugUnitTest assembleDebug
      - name: Import release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPENTDAY_KEYSTORE_PASSWORD: ${{ secrets.SPENTDAY_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$SPENTDAY_KEYSTORE_PASSWORD" ]; then
            echo '::error::Android releases require ANDROID_KEYSTORE_BASE64 and SPENTDAY_KEYSTORE_PASSWORD. See apps/android/README.md.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spentday-release.jks"
          chmod 600 "$RUNNER_TEMP/spentday-release.jks"
          echo "SPENTDAY_KEYSTORE=$RUNNER_TEMP/spentday-release.jks" >> "$GITHUB_ENV"
      - name: Test and build release APK
        if: github.event_name != 'pull_request'
        env:
          SPENTDAY_KEYSTORE_PASSWORD: ${{ secrets.SPENTDAY_KEYSTORE_PASSWORD }}
          SPENTDAY_KEY_ALIAS: ${{ secrets.SPENTDAY_KEY_ALIAS }}
          SPENTDAY_KEY_PASSWORD: ${{ secrets.SPENTDAY_KEY_PASSWORD }}
        shell: bash
        run: |
          # Empty secrets must not replace Gradle's signing defaults.
          [ -n "$SPENTDAY_KEY_ALIAS" ] || unset SPENTDAY_KEY_ALIAS
          [ -n "$SPENTDAY_KEY_PASSWORD" ] || unset SPENTDAY_KEY_PASSWORD
          cd apps/android
          ./gradlew testDebugUnitTest assembleRelease \
            -PspentdayVersionName="$VERSION" -PspentdayVersionCode="$ANDROID_VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/SpentDay-$VERSION.apk"
      - name: Remove release keystore
        if: always()
        timeout-minutes: 2
        shell: bash
        run: rm -f "$RUNNER_TEMP/spentday-release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader libx11 libxcursor libxi hicolor-icon-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: arch-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: arch-cargo-
      - name: Build package as an unprivileged user
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm
          cd ../..
          pacman -Qip packaging/arch/*.pkg.tar.zst
          tar -tf packaging/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  deb:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: deb-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: deb-cargo-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spentday/cargo-deb
          key: linux-amd64-cargo-deb-3.8.0
      - name: Build Debian package on Ubuntu 24.04
        run: |
          docker build --build-arg BASE=ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 -t spentday-deb -f packaging/linux/Dockerfile packaging/linux
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/spentday/cargo-deb"
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -v "$HOME/.cache/spentday/cargo-deb:/opt/cargo-deb" \
            spentday-deb /src/packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-x86_64
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0

  appimage:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: appimage-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: appimage-cargo-
      - name: Build AppImage on Ubuntu 22.04
        run: |
          docker build -t spentday-appimage -f packaging/linux/Dockerfile packaging/linux
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            spentday-appimage /src/packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android, arch, deb, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Prepare installer and checksums
        run: |
          cp packaging/install.sh apps/desktop/linux/data/icons/day.spent.SpentDay.svg dist/
          (cd dist && sha256sum ./*.dmg ./*.apk ./*.pkg.tar.zst ./*.deb ./*.AppImage install.sh day.spent.SpentDay.svg | sed 's|  ./|  |' > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.dmg dist/*.apk dist/*.pkg.tar.zst dist/*.deb dist/*.AppImage dist/install.sh dist/day.spent.SpentDay.svg dist/SHA256SUMS --verify-tag --title "$TAG" --generate-notes
